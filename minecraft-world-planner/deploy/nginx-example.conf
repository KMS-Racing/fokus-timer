# Beispiel: Planer und BlueMap übers Internet – nur mit HTTPS!
# Die Mod bleibt auf 127.0.0.1:8765 (bind in world-planner.json), BlueMap auf 127.0.0.1:8100.
# Port 8765 und 8100 im Router/der Firewall NICHT freigeben, nur 443 (HTTPS).
#
# In config/world-planner.json dann:
#   "publicUrl":  "https://planer.example.de/"
#   "liveMapUrl": "https://planer.example.de/karte/"

# Bremst das Durchprobieren von Login-Codes (zusätzlich zur Bremse in der Mod)
limit_req_zone $binary_remote_addr zone=planer_login:10m rate=10r/m;

server {
    listen 443 ssl;
    server_name planer.example.de;

    # Zertifikat z. B. von Let's Encrypt (certbot)
    ssl_certificate     /etc/letsencrypt/live/planer.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planer.example.de/privkey.pem;

    # Webseite + API der Mod
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/login {
        limit_req zone=planer_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
    }

    # BlueMap unter /karte/
    location /karte/ {
        proxy_pass http://127.0.0.1:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # BlueMap schickt Live-Updates per Server-Sent Events
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# http:// auf https:// umleiten
server {
    listen 80;
    server_name planer.example.de;
    return 301 https://$host$request_uri;
}
