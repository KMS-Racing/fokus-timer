<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renn-Tagebuch – Sim Racing</title>

  <!-- ============================================================
       STYLE (CSS) – hier legen wir fest, WIE alles aussieht.
       ============================================================ -->
  <style>
    /* Reset: nimmt Standard-Abstände raus, damit wir sauber starten */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Farben an einer Stelle, damit man sie leicht ändern kann */
      --bg:      #0d0d0d;
      --karte:   #181818;
      --rand:    #2a2a2a;
      --text:    #e0e0e0;
      --grau:    #888;
      --rot:     #ff5f57;
      --gruen:   #3fb950;
      --gelb:    #e3b341;
    }

    body {
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 0.3rem;
      text-align: center;
    }
    .untertitel {
      color: var(--grau);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    /* Alles bleibt schön mittig und wird auf großen Screens nicht zu breit */
    .spalte { width: 100%; max-width: 640px; }

    /* Link-Karte zum F1 Live-Dashboard */
    .dashboard-karte { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .dashboard-titel { font-size: 0.95rem; color: var(--text); }
    .dashboard-sub { font-size: 0.78rem; color: var(--grau); margin-top: 0.25rem; line-height: 1.4; }
    .dashboard-link {
      text-decoration: none;
      background: var(--rot);
      color: #0d0d0d;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 0.6rem 1.1rem;
      border-radius: 6px;
      white-space: nowrap;
      transition: filter 0.15s;
    }
    .dashboard-link:hover { filter: brightness(1.15); }

    /* Eine "Karte" ist ein umrandeter Block (Formular oder ein Rennen) */
    .karte {
      background: var(--karte);
      border: 1px solid var(--rand);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    h2 {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--rot);
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      color: var(--grau);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.35rem;
    }

    input, textarea {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid var(--rand);
      border-radius: 6px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.6rem 0.7rem;
      margin-bottom: 1rem;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--rot); }
    textarea { resize: vertical; min-height: 3rem; }

    /* Zwei Felder nebeneinander (Strecke + Auto, Datum + ...) */
    .reihe { display: flex; gap: 1rem; flex-wrap: wrap; }
    .reihe > div { flex: 1; min-width: 140px; }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      padding: 0.6rem 1rem;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.2); }

    .btn-rot   { background: var(--rot);   color: #0d0d0d; font-weight: bold; }
    .btn-grau  { background: #2a2a2a;      color: var(--text); }

    /* Bereich zum Rundenzeiten-Eintippen */
    .runden-eingabe { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .runden-eingabe input { margin-bottom: 0; }

    /* Liste der eingetippten Runden (kleine Chips) */
    #runden-liste { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.75rem 0 1rem; }
    .runden-chip {
      background: #0d0d0d;
      border: 1px solid var(--rand);
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .runden-chip .nr { color: var(--grau); font-size: 0.7rem; }
    .runden-chip button {
      background: none; color: var(--grau); padding: 0; font-size: 0.9rem; line-height: 1;
    }
    .runden-chip button:hover { color: var(--rot); }

    .hinweis { font-size: 0.75rem; color: var(--grau); margin-top: -0.5rem; margin-bottom: 1rem; }

    /* Statistik-Kacheln in einem Rennen */
    .stats { display: flex; gap: 0.75rem; flex-wrap: wrap; margin: 1rem 0; }
    .stat {
      flex: 1; min-width: 110px;
      background: #0d0d0d; border: 1px solid var(--rand);
      border-radius: 8px; padding: 0.75rem; text-align: center;
    }
    .stat .wert { font-size: 1.3rem; font-weight: bold; }
    .stat .name { font-size: 0.65rem; color: var(--grau); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.25rem; }

    /* Farbige Konstanz-Bewertung */
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .badge-gruen { background: rgba(63,185,80,0.15);  color: var(--gruen); }
    .badge-gelb  { background: rgba(227,179,65,0.15);  color: var(--gelb); }
    .badge-rot   { background: rgba(255,95,87,0.15);   color: var(--rot); }

    .rennen-kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .rennen-kopf .titel { font-size: 1.05rem; color: var(--text); }
    .rennen-kopf .datum { font-size: 0.75rem; color: var(--grau); margin-top: 0.2rem; }
    .spiel-tag {
      display: inline-block;
      background: rgba(255,95,87,0.12);
      color: var(--rot);
      border-radius: 4px;
      padding: 0.1rem 0.45rem;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
    }
    .rennen-notiz { font-size: 0.85rem; color: #bbb; font-style: italic; margin: 0.5rem 0; }

    .loeschen { background: none; color: var(--grau); font-size: 0.75rem; padding: 0.2rem; }
    .loeschen:hover { color: var(--rot); }

    /* Das Mini-Diagramm */
    svg { width: 100%; height: 120px; display: block; margin-top: 0.5rem; }

    .leer { color: var(--grau); text-align: center; padding: 2rem 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>🏁 Renn-Tagebuch</h1>
  <div class="untertitel">Sim Racing · Version 1</div>

  <div class="spalte">

    <!-- ========== LINK: F1 Live-Dashboard ========== -->
    <div class="karte dashboard-karte">
      <div class="dashboard-text">
        <div class="dashboard-titel">🏎️ Live-Dashboard für F1 25 &amp; 26</div>
        <div class="dashboard-sub">Rundenzeiten, Reifen-Abnutzung &amp; Sprit live beim Fahren.<br>Vorher lokal starten: <code>node server.js</code></div>
      </div>
      <a class="dashboard-link" href="http://localhost:3000" target="_blank" rel="noopener">Öffnen ↗</a>
    </div>

    <!-- ========== FORMULAR: Neues Rennen ========== -->
    <div class="karte">
      <h2>Neues Rennen</h2>

      <div class="reihe">
        <div>
          <label for="spiel">Spiel</label>
          <input id="spiel" type="text" list="spiel-vorschlaege" placeholder="z.B. F1 25" />
          <!-- Vorschläge, die beim Tippen aufklappen (frei überschreibbar) -->
          <datalist id="spiel-vorschlaege">
            <option value="F1 25"></option>
            <option value="iRacing"></option>
            <option value="Assetto Corsa Competizione"></option>
            <option value="Gran Turismo 7"></option>
            <option value="Le Mans Ultimate"></option>
            <option value="Automobilista 2"></option>
          </datalist>
        </div>
        <div>
          <label for="datum">Datum</label>
          <input id="datum" type="date" />
        </div>
      </div>

      <div class="reihe">
        <div>
          <label for="strecke">Strecke</label>
          <input id="strecke" type="text" placeholder="z.B. Monza" />
        </div>
        <div>
          <label for="auto">Auto / Team</label>
          <input id="auto" type="text" placeholder="z.B. Ferrari" />
        </div>
      </div>

      <label for="notiz">Notiz zum Gefühl</label>
      <textarea id="notiz" placeholder="z.B. Heck kam raus in Kurve 3, Reifen wurden spät heiß"></textarea>

      <label for="runde">Rundenzeiten</label>
      <div class="runden-eingabe">
        <input id="runde" type="text" placeholder="1:23.456" />
        <button class="btn-grau" id="runde-hinzu">+ Runde</button>
      </div>
      <div class="hinweis">Format: Minuten:Sekunden.Millisekunden – Enter zählt auch als „hinzufügen".</div>

      <div id="runden-liste"></div>

      <button class="btn-rot" id="rennen-speichern">Rennen speichern</button>
    </div>

    <!-- ========== LISTE: Meine Rennen ========== -->
    <h2 style="letter-spacing:0.2em;">Meine Rennen</h2>
    <div id="rennen-container"></div>

  </div>

  <!-- ============================================================
       SKRIPT (JavaScript) – hier passiert die eigentliche Logik.
       ============================================================ -->
  <script>
    // ---- Kleine Helfer, um Elemente kürzer anzusprechen ----
    const $ = (id) => document.getElementById(id);

    // Der Speicher-Schlüssel im Browser (localStorage)
    const SPEICHER_SCHLUESSEL = 'rennTagebuch';

    // Hier sammeln wir die Runden, die gerade fürs neue Rennen eingetippt werden
    let aktuelleRunden = []; // Liste von Zeiten in Millisekunden

    // ==========================================================
    // ZEIT UMWANDELN
    // ==========================================================

    // Wandelt Text wie "1:23.456" in Millisekunden um (oder null, wenn ungültig)
    function zeitZuMs(text) {
      text = text.trim().replace(',', '.'); // Komma erlauben: 1:23,456
      if (!text) return null;

      let minuten = 0;
      let sekunden = 0;

      if (text.includes(':')) {
        const teile = text.split(':');
        minuten = parseInt(teile[0], 10);
        sekunden = parseFloat(teile[1]);
      } else {
        // Auch reine Sekunden erlauben, z.B. "83.456"
        sekunden = parseFloat(text);
      }

      if (isNaN(minuten) || isNaN(sekunden)) return null;
      return Math.round((minuten * 60 + sekunden) * 1000);
    }

    // Wandelt Millisekunden zurück in "1:23.456"
    function msZuZeit(ms) {
      const gesamtSekunden = ms / 1000;
      const min = Math.floor(gesamtSekunden / 60);
      const sek = (gesamtSekunden - min * 60).toFixed(3).padStart(6, '0');
      return min + ':' + sek;
    }

    // ==========================================================
    // RUNDEN EINTIPPEN (im Formular)
    // ==========================================================

    function rundeHinzufuegen() {
      const eingabe = $('runde');
      const ms = zeitZuMs(eingabe.value);

      if (ms === null) {
        alert('Bitte eine gültige Zeit eingeben, z.B. 1:23.456');
        return;
      }

      aktuelleRunden.push(ms);
      eingabe.value = '';
      eingabe.focus();
      zeigeAktuelleRunden();
    }

    // Zeichnet die kleinen Runden-Chips unter dem Eingabefeld
    function zeigeAktuelleRunden() {
      const liste = $('runden-liste');
      liste.innerHTML = '';

      aktuelleRunden.forEach((ms, index) => {
        const chip = document.createElement('div');
        chip.className = 'runden-chip';
        chip.innerHTML =
          '<span class="nr">R' + (index + 1) + '</span>' +
          '<span>' + msZuZeit(ms) + '</span>' +
          '<button title="entfernen">✕</button>';

        // Klick auf das ✕ entfernt genau diese Runde
        chip.querySelector('button').addEventListener('click', () => {
          aktuelleRunden.splice(index, 1);
          zeigeAktuelleRunden();
        });

        liste.appendChild(chip);
      });
    }

    // ==========================================================
    // AUSWERTUNG (Beste, Durchschnitt, Konstanz)
    // ==========================================================

    function berechneStatistik(runden) {
      const beste = Math.min(...runden);
      const summe = runden.reduce((a, b) => a + b, 0);
      const schnitt = summe / runden.length;

      // Standardabweichung = wie stark schwanken die Zeiten um den Durchschnitt
      const varianz = runden.reduce((a, b) => a + (b - schnitt) ** 2, 0) / runden.length;
      const schwankung = Math.sqrt(varianz); // in Millisekunden

      return { beste, schnitt, schwankung };
    }

    // Aus der Schwankung (in ms) eine verständliche Bewertung machen
    function konstanzBewertung(schwankungMs) {
      const s = schwankungMs / 1000; // in Sekunden
      if (s < 0.25) return { text: 'Sehr sauber', klasse: 'badge-gruen' };
      if (s < 0.60) return { text: 'Sauber',      klasse: 'badge-gelb' };
      return { text: 'Unruhig', klasse: 'badge-rot' };
    }

    // ==========================================================
    // REIFEN-ABBAU (Trend der Rundenzeiten über das Rennen)
    // ==========================================================

    // Lineare Regression: legt eine "beste Gerade" durch die Rundenzeiten.
    // slope = wie viele Millisekunden pro Runde langsamer (+) oder schneller (-).
    // intercept = der rechnerische Startwert bei Runde 1 (für die Trendlinie).
    function berechneTrend(runden) {
      const n = runden.length;
      const summeX  = (n - 1) * n / 2;                                  // 0 + 1 + ... + (n-1)
      const summeY  = runden.reduce((a, b) => a + b, 0);
      const summeXY = runden.reduce((a, b, i) => a + i * b, 0);
      const summeXX = runden.reduce((a, _, i) => a + i * i, 0);

      const nenner = n * summeXX - summeX * summeX;
      const slope = nenner === 0 ? 0 : (n * summeXY - summeX * summeY) / nenner;
      const intercept = (summeY - slope * summeX) / n;
      return { slope, intercept };
    }

    // Aus dem Trend (ms pro Runde) eine verständliche Bewertung machen
    function abbauBewertung(slopeMsProRunde) {
      const s = slopeMsProRunde / 1000; // Sekunden pro Runde
      if (s > 0.05)  return { text: 'Deutlicher Abbau', klasse: 'badge-rot' };
      if (s > 0.02)  return { text: 'Leichter Abbau',   klasse: 'badge-gelb' };
      if (s < -0.02) return { text: 'Wird schneller',   klasse: 'badge-gruen' };
      return { text: 'Konstant', klasse: 'badge-gruen' };
    }

    // ==========================================================
    // MINI-DIAGRAMM (als SVG selbst gezeichnet)
    // ==========================================================

    function baueDiagramm(runden) {
      const breite = 600, hoehe = 120, rand = 12;

      const minWert = Math.min(...runden);
      const maxWert = Math.max(...runden);
      const spanne = (maxWert - minWert) || 1; // durch 0 teilen vermeiden

      // Jede Runde in einen (x, y)-Punkt umrechnen.
      // Schnellere (kleinere) Zeiten landen weiter oben.
      const punkte = runden.map((wert, i) => {
        const x = rand + (runden.length === 1 ? 0.5 : i / (runden.length - 1)) * (breite - 2 * rand);
        const y = rand + ((wert - minWert) / spanne) * (hoehe - 2 * rand);
        return [x, y];
      });

      const linie = punkte.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');

      // Gestrichelte Trendlinie (Reifen-Abbau) – nur ab 2 Runden sinnvoll
      let trendLinie = '';
      if (runden.length >= 2) {
        const t = berechneTrend(runden);
        const begrenze = (y) => Math.max(rand, Math.min(hoehe - rand, y));
        const yStart = begrenze(rand + ((t.intercept - minWert) / spanne) * (hoehe - 2 * rand));
        const yEnde  = begrenze(rand + ((t.intercept + t.slope * (runden.length - 1) - minWert) / spanne) * (hoehe - 2 * rand));
        trendLinie =
          '<line x1="' + rand + '" y1="' + yStart.toFixed(1) + '" x2="' + (breite - rand) + '" y2="' + yEnde.toFixed(1) +
          '" stroke="#888" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"><title>Trend (Reifen-Abbau)</title></line>';
      }

      // Kreise für jede Runde; die beste Runde bekommt eine andere Farbe
      const kreise = punkte.map((p, i) => {
        const istBeste = runden[i] === minWert;
        const farbe = istBeste ? '#3fb950' : '#ff5f57';
        const r = istBeste ? 4 : 3;
        return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
               '" r="' + r + '" fill="' + farbe + '"><title>R' + (i + 1) + ': ' + msZuZeit(runden[i]) + '</title></circle>';
      }).join('');

      return '<svg viewBox="0 0 ' + breite + ' ' + hoehe + '" preserveAspectRatio="none">' +
             trendLinie +
             '<polyline points="' + linie + '" fill="none" stroke="#ff5f57" stroke-width="1.5" opacity="0.6" />' +
             kreise +
             '</svg>';
    }

    // ==========================================================
    // SPEICHERN & LADEN (localStorage)
    // ==========================================================

    function ladeRennen() {
      // try/catch: manche Browser blockieren den Speicher – dann keine Fehler,
      // die App läuft einfach ohne dauerhaftes Speichern weiter.
      try {
        const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
        return roh ? JSON.parse(roh) : [];
      } catch (e) {
        return [];
      }
    }

    function speichereRennen(liste) {
      try {
        localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(liste));
      } catch (e) {
        alert('Speichern im Browser ist gerade nicht möglich – deine Eingaben bleiben nur bis zum Neuladen erhalten.');
      }
    }

    // ==========================================================
    // NEUES RENNEN SPEICHERN
    // ==========================================================

    function rennenSpeichern() {
      const spiel   = $('spiel').value.trim();
      const strecke = $('strecke').value.trim();
      const auto    = $('auto').value.trim();
      const datum   = $('datum').value;
      const notiz   = $('notiz').value.trim();

      if (!strecke) { alert('Bitte eine Strecke eintragen.'); return; }
      if (aktuelleRunden.length === 0) { alert('Bitte mindestens eine Rundenzeit eintippen.'); return; }

      const rennen = {
        id: Date.now(), // eindeutige Nummer über die Zeit
        spiel, strecke, auto, datum, notiz,
        runden: aktuelleRunden.slice() // Kopie der Runden-Liste
      };

      const alle = ladeRennen();
      alle.push(rennen);
      speichereRennen(alle);

      // Formular zurücksetzen
      $('spiel').value = '';
      $('strecke').value = '';
      $('auto').value = '';
      $('notiz').value = '';
      aktuelleRunden = [];
      zeigeAktuelleRunden();
      setzeHeutigesDatum();

      zeigeAlleRennen();
    }

    // ==========================================================
    // ALLE RENNEN ANZEIGEN
    // ==========================================================

    function zeigeAlleRennen() {
      const container = $('rennen-container');
      const alle = ladeRennen();

      if (alle.length === 0) {
        container.innerHTML = '<div class="karte leer">Noch keine Rennen gespeichert.<br>Trag oben dein erstes Rennen ein! 🏎️</div>';
        return;
      }

      container.innerHTML = '';

      // Neuestes Rennen zuerst: Kopie umdrehen
      alle.slice().reverse().forEach((rennen) => {
        const stat = berechneStatistik(rennen.runden);
        const bewertung = konstanzBewertung(stat.schwankung);

        // Reifen-Abbau nur berechnen, wenn es mindestens 2 Runden gibt
        let abbauHtml = '';
        if (rennen.runden.length >= 2) {
          const trend = berechneTrend(rennen.runden);
          const ab = abbauBewertung(trend.slope);
          const proRunde = trend.slope / 1000;              // Sekunden pro Runde
          const vorzeichen = proRunde >= 0 ? '+' : '';
          abbauHtml =
            '<div style="margin-top:0.4rem">Reifen-Abbau: ' +
              '<span class="badge ' + ab.klasse + '">' + ab.text + '</span> ' +
              '<span style="color:#888;font-size:0.8rem">' + vorzeichen + proRunde.toFixed(3) + ' s/Runde</span>' +
            '</div>';
        }

        const karte = document.createElement('div');
        karte.className = 'karte';
        karte.innerHTML =
          '<div class="rennen-kopf">' +
            '<div>' +
              (rennen.spiel ? '<div class="spiel-tag">' + escape(rennen.spiel) + '</div>' : '') +
              '<div class="titel">' + escape(rennen.strecke) + (rennen.auto ? ' · ' + escape(rennen.auto) : '') + '</div>' +
              '<div class="datum">' + (rennen.datum || '') + ' · ' + rennen.runden.length + ' Runden</div>' +
            '</div>' +
            '<button class="loeschen">löschen</button>' +
          '</div>' +
          (rennen.notiz ? '<div class="rennen-notiz">„' + escape(rennen.notiz) + '"</div>' : '') +
          '<div class="stats">' +
            '<div class="stat"><div class="wert" style="color:#3fb950">' + msZuZeit(stat.beste) + '</div><div class="name">Beste Runde</div></div>' +
            '<div class="stat"><div class="wert">' + msZuZeit(stat.schnitt) + '</div><div class="name">Durchschnitt</div></div>' +
            '<div class="stat"><div class="wert">±' + (stat.schwankung / 1000).toFixed(3) + 's</div><div class="name">Schwankung</div></div>' +
          '</div>' +
          '<div>Konstanz: <span class="badge ' + bewertung.klasse + '">' + bewertung.text + '</span></div>' +
          abbauHtml +
          baueDiagramm(rennen.runden);

        // Löschen-Knopf für genau dieses Rennen
        karte.querySelector('.loeschen').addEventListener('click', () => {
          if (confirm('Dieses Rennen wirklich löschen?')) {
            const gefiltert = ladeRennen().filter(r => r.id !== rennen.id);
            speichereRennen(gefiltert);
            zeigeAlleRennen();
          }
        });

        container.appendChild(karte);
      });
    }

    // Macht Text sicher fürs Einfügen in HTML (verhindert kaputte Anzeige)
    function escape(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ==========================================================
    // START: alles verkabeln
    // ==========================================================

    function setzeHeutigesDatum() {
      $('datum').value = new Date().toISOString().slice(0, 10);
    }

    // Knöpfe mit Funktionen verbinden
    $('runde-hinzu').addEventListener('click', rundeHinzufuegen);
    $('rennen-speichern').addEventListener('click', rennenSpeichern);

    // Enter im Runden-Feld = Runde hinzufügen
    $('runde').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); rundeHinzufuegen(); }
    });

    // Beim Laden der Seite: Datum vorbelegen und gespeicherte Rennen zeigen
    setzeHeutigesDatum();
    zeigeAlleRennen();
  </script>
</body>
</html>
